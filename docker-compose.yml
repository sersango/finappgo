services:
  finappgo:
    image: ghcr.io/sersango/finappgo:latest
    container_name: finappgo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8765:8765"
    volumes:
      - finappgo_datos:/data
    environment:
      - TZ=Europe/Madrid

volumes:
  finappgo_datos:
    name: ${FINAPPGO_DATA_VOLUME:-finappgo_datos}
    external: ${FINAPPGO_EXTERNAL_VOLUME:-false}
